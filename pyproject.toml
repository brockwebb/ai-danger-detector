[project]
name = "ai-danger-detector"
version = "0.1.0"
description = "Prototype framework for AI oversight triage and numerical reliance workflow modeling."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
